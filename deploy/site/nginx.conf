server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    client_max_body_size 128m;
    resolver 127.0.0.11 valid=30s;
    set $business_origin http://business:8101;
    set $agent_origin http://business:8201;
    set $websocket_origin http://business:9101;
    set $upload_origin http://minio:9000;
    # Only policy-signed form uploads to the business bucket; no object reads or console exposure.
    location = /upload-storage/tianmu-upload {
        limit_except POST { deny all; }
        client_max_body_size 6m;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass $upload_origin/tianmu-upload;
    }
    location /api/internal/ { return 404; }
    location /api/agent/ {
        proxy_pass $agent_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        add_header X-Accel-Buffering no always;
    }
    location /api/ { proxy_pass $business_origin; proxy_set_header Host $host; }
    location /ws/bulletScreen/ {
        proxy_pass $websocket_origin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
    }
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
