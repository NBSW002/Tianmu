# Optional overlay: an existing private Milvus instance, no public database ports or automatic schema changes.
services:
  agent:
    environment:
      FEEDBACK_RESULT_REUSE_ENABLED: ${FEEDBACK_RESULT_REUSE_ENABLED:-true}
      FEEDBACK_RESULT_REUSE_WINDOW: ${FEEDBACK_RESULT_REUSE_WINDOW:-10m}
      FEEDBACK_RESULT_REUSE_MAX_ENTRIES: ${FEEDBACK_RESULT_REUSE_MAX_ENTRIES:-1024}
      FEEDBACK_READ_PARALLELISM: ${FEEDBACK_READ_PARALLELISM:-1}
      VIDEO_CACHE_MEMORY_TTL: ${VIDEO_CACHE_MEMORY_TTL:-1h}
      VIDEO_CACHE_RETENTION: ${VIDEO_CACHE_RETENTION:-0s}
      VIDEO_CACHE_MAX_ENTRIES: ${VIDEO_CACHE_MAX_ENTRIES:-1024}
      AGENT_FEEDBACK_EMBEDDING_ENABLED: "true"
      AGENT_FEEDBACK_EMBEDDING_ENDPOINT: https://maas.qianwenaiapi.com/compatible-mode/v1/embeddings
      AGENT_FEEDBACK_EMBEDDING_TOKEN_FILE: /run/secrets/feedback-embedding-token
      AGENT_FEEDBACK_EMBEDDING_REVISION: ${FEEDBACK_EMBEDDING_REVISION:?Set an explicit embedding cache revision}
      AGENT_FEEDBACK_EMBEDDING_DIMENSION: "${FEEDBACK_EMBEDDING_DIMENSION:-2560}"
      AGENT_FEEDBACK_MILVUS_ENABLED: "true"
      AGENT_FEEDBACK_MILVUS_ENDPOINT: ${FEEDBACK_MILVUS_ENDPOINT:?Set the private Milvus endpoint}
      AGENT_FEEDBACK_MILVUS_TOKEN_FILE: /run/secrets/feedback-milvus-token
      AGENT_FEEDBACK_MILVUS_DATABASE: ${FEEDBACK_MILVUS_DATABASE:-default}
      AGENT_FEEDBACK_MILVUS_COLLECTION: ${FEEDBACK_MILVUS_COLLECTION:?Set the provisioned collection}
      AGENT_FEEDBACK_MILVUS_DIMENSION: "${FEEDBACK_EMBEDDING_DIMENSION:-2560}"
    secrets:
      - feedback-embedding-token
      - feedback-milvus-token
secrets:
  feedback-embedding-token:
    file: '${SITE_CONFIG_DIR}/secrets/feedback-embedding-token'
  feedback-milvus-token:
    file: '${SITE_CONFIG_DIR}/secrets/feedback-milvus-token'
